services:
  ollama:
    image: ollama/ollama:latest
    networks: [backend]
    volumes:
      - /home/raffael/Projekte/ollama/.ollama:/root/.ollama
    # bewusst keine ports: -> nur intern im Overlay erreichbar

  ollama-tailscale:
    image: ollama-tailscale-sidecar:latest
    hostname: ollama
    networks: [backend]
    volumes:
      - ts_state:/var/lib/tailscale
    secrets:
      - ts_authkey
    deploy:
      replicas: 1

networks:
  backend:
    driver: overlay

secrets:
  ts_authkey:
    external: true

volumes:
  ollama_data:
  ts_state: