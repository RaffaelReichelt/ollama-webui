services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    networks: [backend]
    # Ohne das landet gar kein externer Resolver im Container ("NO EXTERNAL
    # NAMESERVERS DEFINED" in /etc/resolv.conf, da der Host tailscaled als
    # globalen DNS-Override nutzt und /etc/resolv.conf selbst fehlt) - "ollama
    # pull" schlägt dann mit "dial tcp: lookup registry.ollama.ai on
    # 127.0.0.11:53: server misbehaving" fehl. Gleicher Bug wie im
    # nanobot-Stack, siehe dortiges docker-compose.yml.
    dns:
      - 100.100.100.100
      - 1.1.1.1
    volumes:
      - ${OLLAMA_DATA_DIR:-/var/lib/ollama}:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=-1
      # Default-Kontext statt 262144 (Modell-Maximum): der KV-Cache sprengt
      # sonst den Unified Memory (zwei Modelle belegten zusammen ~96 GiB).
      - OLLAMA_CONTEXT_LENGTH=65536
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-64G}
    # bewusst keine ports: -> nur intern im Overlay erreichbar

  ollama-tailscale:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:latest}
    # Kein "hostname: ollama" - sonst löst "ollama" im Overlay auf den Sidecar
    # selbst auf statt auf den Ollama-Service. Tailnet-Name kommt aus TS_HOSTNAME.
    networks: [backend]
    environment:
      - TS_AUTHKEY=file:/run/secrets/ts_authkey
      - TS_HOSTNAME=ollama
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ts_state:/var/lib/tailscale
      - ${OLLAMA_SERVE_JSON:-/opt/ollama/serve.json}:/config/serve.json:ro
    secrets:
      - ts_authkey
    deploy:
      replicas: 1

networks:
  backend:
    driver: overlay

secrets:
  ts_authkey:
    external: true
    name: ts_authkey

volumes:
  ts_state: